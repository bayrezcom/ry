services:
  terjiman-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: terjiman-backend:latest
    container_name: terjiman-backend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:?AI_API_KEY must be set in .env}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_TRANSCRIBE_MODEL: ${AI_TRANSCRIBE_MODEL:-whisper-1}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-60000}
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      MAX_TEXT_LENGTH: ${MAX_TEXT_LENGTH:-5000}
      MAX_AUDIO_BYTES: ${MAX_AUDIO_BYTES:-10485760}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-60}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
